syntax = "proto3";

package codegen.perms;

import "buf/validate/validate.proto";
import "google/protobuf/descriptor.proto";
import "resources/permissions/attributes/attributes.proto";
import "resources/properties/properties.proto";

option go_package = "github.com/fivenet-app/fivenet/v2026/gen/go/proto/codegen/perms;perms";

extend google.protobuf.MethodOptions {
  PermsOptions perms = 51002;
}

message PermsOptions {
  bool enabled = 1;
  optional string namespace = 2;
  optional string service = 3;
  optional string name = 4;
  repeated string names = 5;

  int32 order = 6;
  repeated Attr attrs = 7;
  bool internal = 8;
}

message Attr {
  string key = 1;
  string value = 2;
  resources.permissions.attributes.AttributeType type = 3 [(buf.validate.field).enum.defined_only = true];

  repeated string valid_string_list = 4;

  // Required for PropertyList attributes so the backend can restrict the
  // generated keys to the appropriate property scope.
  optional resources.properties.PropertyScope property_scope = 5 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

}

extend google.protobuf.ServiceOptions {
  ServiceOptions perms_svc = 51005;
}

message ServiceOptions {
  int32 order = 1;
  optional string icon = 2;

  optional string namespace = 3;
  optional string service = 4;

  repeated AdditionalServicePerm additional_perms = 5;
  repeated SystemProperty system_properties = 6;
  repeated resources.properties.PropertyGroup property_groups = 7;
}

// SystemProperty declares a property whose key and semantics are owned by
// FiveNet code. The backend generator registers these definitions at startup;
// only the enabled state may be overridden by an instance.
message SystemProperty {
  resources.properties.PropertyScope scope = 1;
  string key = 2;
  resources.properties.PropertyValueType value_type = 3;
  bool enabled = 4;
  string display_key = 5;
  string label = 6;
  optional string description = 7;
  bool searchable = 8;
  resources.properties.PropertyValueFormat value_format = 9;
  resources.properties.PropertyBehavior behavior = 10;
  resources.properties.PropertyRenderer renderer = 17;
  resources.properties.PropertyRendererConfig renderer_config = 18;
  resources.properties.PropertyDisplayMode display_mode = 19;
  optional string unit = 11;
  optional uint32 decimal_places = 12;
  optional string currency = 13;
  string group_key = 14;
  int32 sort_order = 15;
  bool pinned = 16;
  bool implicit = 20;
}

message AdditionalServicePerm {
  string name = 3;
  int32 order = 4;
  repeated Attr attrs = 5;
}
