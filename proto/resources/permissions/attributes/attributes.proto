syntax = "proto3";

package resources.permissions.attributes;

import "buf/validate/validate.proto";
import "codegen/dbscanner/dbscanner.proto";
import "codegen/sanitizer/sanitizer.proto";
import "resources/timestamp/timestamp.proto";

option go_package = "github.com/fivenet-app/fivenet/v2026/gen/go/proto/resources/permissions/attributes;permissionsattributes";

enum AttributeType {
  ATTRIBUTE_TYPE_UNSPECIFIED = 0;
  ATTRIBUTE_TYPE_STRING_LIST = 1;
  ATTRIBUTE_TYPE_JOB_LIST = 2;
  ATTRIBUTE_TYPE_JOB_GRADE_LIST = 3;
  // Property lists select runtime-defined property keys. The RPC permission
  // controls the operation; this attribute only controls which properties.
  ATTRIBUTE_TYPE_PROPERTY_LIST = 4;
}

message RoleAttribute {
  int64 role_id = 1;
  optional resources.timestamp.Timestamp created_at = 2;
  int64 attr_id = 3;
  int64 permission_id = 4;
  string namespace = 5 [(buf.validate.field).string.max_len = 48];
  string service = 6 [(buf.validate.field).string.max_len = 64];
  string name = 7 [(buf.validate.field).string.max_len = 255];
  string key = 8 [(buf.validate.field).string.max_len = 255];
  string type = 9 [(buf.validate.field).string.max_len = 255];
  AttributeValues valid_values = 10;
  AttributeValues value = 11;
  optional AttributeValues max_values = 12;
}

message AttributeValues {
  option (codegen.dbscanner.dbscanner) = {enabled: true};

  oneof valid_values {
    option (buf.validate.oneof).required = true;

    StringList string_list = 1;
    StringList job_list = 2;
    JobGradeList job_grade_list = 3;
    PropertyList property_list = 4;
  }
}

message StringList {
  repeated string strings = 1 [(codegen.sanitizer.sanitizer) = {
    enabled: true
    strip_html_tags: true
  }];
}

message PropertyList {
  repeated string keys = 1 [(buf.validate.field).repeated.items.string = {
    min_len: 1
    max_len: 64
    pattern: "^[a-z][a-z0-9_.-]*$"
  }];
  // Display metadata for the keys above. This is response metadata only; role
  // attribute values continue to persist and authorize by key.
  repeated PropertyListEntry properties = 2;
}

message PropertyListEntry {
  string key = 1;
  string label = 2;
}

message JobGradeList {
  bool fine_grained = 2;
  map<string, int32> jobs = 1;
  map<string, JobGrades> grades = 3;
}

message JobGrades {
  repeated int32 grades = 1;
}
