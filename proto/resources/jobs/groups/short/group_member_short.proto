syntax = "proto3";

package resources.jobs.groups.short;

import "buf/validate/validate.proto";

option go_package = "github.com/fivenet-app/fivenet/v2026/gen/go/proto/resources/jobs/groups/short;groupsshort";

// Lightweight group information attached to a colleague.
message GroupMemberShort {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
  string job = 2 [(buf.validate.field).string.max_len = 20];
  string name = 3 [(buf.validate.field).string.max_len = 128];
  optional string short_name = 4 [(buf.validate.field).string.max_len = 32];
  optional string color = 5 [(buf.validate.field).string.max_len = 32];
  bool is_leader = 6;
}
