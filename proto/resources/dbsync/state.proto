syntax = "proto3";

package resources.dbsync;

import "buf/validate/validate.proto";
import "resources/timestamp/timestamp.proto";

option go_package = "github.com/fivenet-app/fivenet/v2026/gen/go/proto/resources/dbsync;dbsync";

message DBSyncCheckpoint {
  optional resources.timestamp.Timestamp last_check = 1;
  optional string last_id = 2 [(buf.validate.field).string.max_len = 128];
}

message DBSyncTableSyncState {
  string table = 1 [(buf.validate.field).string.max_len = 64];
  optional DBSyncCheckpoint checkpoint = 2;
  optional resources.timestamp.Timestamp last_synced_at = 3;
  optional resources.timestamp.Timestamp last_attempt_at = 4;
  optional string last_error = 5 [(buf.validate.field).string.max_len = 256];
  bool enabled = 6;
}
