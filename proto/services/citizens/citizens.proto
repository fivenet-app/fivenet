syntax = "proto3";

package services.citizens;

import "buf/validate/validate.proto";
import "codegen/itemslen/itemslen.proto";
import "codegen/perms/perms.proto";
import "codegen/sanitizer/sanitizer.proto";
import "resources/common/database/database.proto";
import "resources/file/file.proto";
import "resources/file/filestore.proto";
import "resources/properties/properties.proto";
import "resources/timestamp/timestamp.proto";
import "resources/users/activity/activity.proto";
import "resources/users/props/props.proto";
import "resources/users/user.proto";

option go_package = "github.com/fivenet-app/fivenet/v2026/gen/go/proto/services/citizens;citizens";

message ListCitizensRequest {
  resources.common.database.PaginationRequest pagination = 1 [(buf.validate.field).required = true];
  optional resources.common.database.Sort sort = 2;
  // Search params
  string search = 3 [(buf.validate.field).string.max_len = 64];
  optional bool wanted = 4;
  optional string phone_number = 5 [(buf.validate.field).string.max_len = 20];
  optional uint32 traffic_infraction_points = 6;
  optional string dateofbirth = 7 [(buf.validate.field).string.max_len = 10];
  optional int64 open_fines = 8;

  // Height range search (in cm)
  optional float min_height = 9;
  optional float max_height = 10;
  repeated resources.properties.PropertyFilter property_filters = 11 [(buf.validate.field).repeated.max_items = 8];
}

message ListCitizensResponse {
  resources.common.database.PaginationResponse pagination = 1 [(buf.validate.field).required = true];
  repeated resources.users.User users = 2 [(codegen.itemslen.enabled) = true];
}

message GetUserRequest {
  int32 user_id = 1 [(buf.validate.field).int32.gt = 0];
  optional bool info_only = 2;
}

message GetUserResponse {
  resources.users.User user = 1;
}

message ListUserActivityRequest {
  resources.common.database.PaginationRequest pagination = 1 [(buf.validate.field).required = true];
  optional resources.common.database.Sort sort = 2;
  // Search params
  int32 user_id = 3 [(buf.validate.field).int32.gt = 0];
  // Activity types to filter by. If empty, all activity types will be returned.
  repeated resources.users.activity.UserActivityType types = 4 [(buf.validate.field).repeated = {
    max_items: 20
    items: {
      enum: {defined_only: true}
    }
  }];
  optional resources.timestamp.Timestamp from = 5;
  optional resources.timestamp.Timestamp to = 6;
  // Restricts generic PROPERTY activity entries to these custom property keys.
  repeated string property_keys = 7 [(buf.validate.field).repeated = {
    max_items: 20
    items: {
      string: {max_len: 64}
    }
  }];
}

message ListUserActivityResponse {
  resources.common.database.PaginationResponse pagination = 1 [(buf.validate.field).required = true];
  repeated resources.users.activity.UserActivity activity = 2 [(codegen.itemslen.enabled) = true];
}

message SetUserPropsRequest {
  resources.users.props.UserProps props = 1 [(buf.validate.field).required = true];
  string reason = 2 [
    (buf.validate.field).string = {
      min_len: 3
      max_len: 255
    },
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (codegen.sanitizer.sanitizer) = {enabled: true}
  ];
  // Generic custom scalar properties. Managed system properties continue to
  // use the dedicated fields above and produce their specialized activities.
  repeated resources.properties.PropertyChange property_changes = 3 [(buf.validate.field).repeated.max_items = 20];
}

message SetUserPropsResponse {
  resources.users.props.UserProps props = 1;
}

message DeleteAvatarRequest {}

message DeleteAvatarResponse {}

message DeleteMugshotRequest {
  int32 user_id = 1 [(buf.validate.field).int32.gt = 0];
  string reason = 2 [
    (buf.validate.field).string = {
      min_len: 3
      max_len: 255
    },
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (codegen.sanitizer.sanitizer) = {enabled: true}
  ];
}

message DeleteMugshotResponse {}

// CitizenFile is a restricted investigation attachment. The public profile
// avatar is deliberately not represented here.
message CitizenFile {
  resources.file.File file = 1 [(buf.validate.field).required = true];
  string kind = 2 [(buf.validate.field).string.max_len = 32];
}

message ListCitizenFilesRequest {
  int32 user_id = 1 [(buf.validate.field).int32.gt = 0];
}

message ListCitizenFilesResponse {
  repeated CitizenFile files = 1 [(codegen.itemslen.enabled) = true];
}

message DeleteCitizenFileRequest {
  int32 user_id = 1 [(buf.validate.field).int32.gt = 0];
  int64 file_id = 2 [(buf.validate.field).int64.gt = 0];
  string reason = 3 [
    (buf.validate.field).string = {
      min_len: 3
      max_len: 255
    },
    (codegen.sanitizer.sanitizer) = {enabled: true}
  ];
}

message DeleteCitizenFileResponse {}

service CitizensService {
  option (codegen.perms.perms_svc) = {
    order: 30
    icon: "i-mdi-account-multiple-outline"
    property_groups: {
      scope: PROPERTY_SCOPE_USER
      key: "personal"
      display_key: "components.settings.property_definitions.groups.personal"
      sort_order: 100
    }
    property_groups: {
      scope: PROPERTY_SCOPE_USER
      key: "contact"
      display_key: "components.settings.property_definitions.groups.contact"
      sort_order: 200
    }
    property_groups: {
      scope: PROPERTY_SCOPE_USER
      key: "status"
      display_key: "components.settings.property_definitions.groups.status"
      sort_order: 300
    }
    property_groups: {
      scope: PROPERTY_SCOPE_USER
      key: "labels"
      display_key: "components.settings.property_definitions.groups.labels"
      sort_order: 400
    }
    property_groups: {
      scope: PROPERTY_SCOPE_USER
      key: "licenses"
      display_key: "components.settings.property_definitions.groups.licenses"
      sort_order: 500
    }
    system_properties: [
      {
        scope: PROPERTY_SCOPE_USER
        key: "user.dateofbirth"
        value_type: PROPERTY_VALUE_TYPE_STRING
        behavior: PROPERTY_BEHAVIOR_MANAGED
        enabled: true
        implicit: true
        display_key: "common.date_of_birth"
        group_key: "personal"
        sort_order: 100
      },
      {
        scope: PROPERTY_SCOPE_USER
        key: "user.sex"
        value_type: PROPERTY_VALUE_TYPE_STRING
        behavior: PROPERTY_BEHAVIOR_MANAGED
        enabled: true
        implicit: true
        display_key: "common.sex"
        group_key: "personal"
        sort_order: 200
      },
      {
        scope: PROPERTY_SCOPE_USER
        key: "user.height"
        value_type: PROPERTY_VALUE_TYPE_NUMBER
        renderer: PROPERTY_RENDERER_HEIGHT
        behavior: PROPERTY_BEHAVIOR_MANAGED
        enabled: true
        implicit: true
        display_key: "common.height"
        group_key: "personal"
        sort_order: 300
      },
      {
        scope: PROPERTY_SCOPE_USER
        key: "user.phone_number"
        value_type: PROPERTY_VALUE_TYPE_STRING
        renderer: PROPERTY_RENDERER_PHONE
        behavior: PROPERTY_BEHAVIOR_MANAGED
        enabled: true
        display_key: "common.phone_number"
        searchable: true
        group_key: "contact"
        sort_order: 100
      },
      {
        scope: PROPERTY_SCOPE_USER
        key: "user.visum"
        value_type: PROPERTY_VALUE_TYPE_INTEGER
        enabled: true
        implicit: true
        display_key: "common.visum"
        group_key: "contact"
        sort_order: 300
      },
      {
        scope: PROPERTY_SCOPE_USER
        key: "user.licenses"
        value_type: PROPERTY_VALUE_TYPE_STRING
        behavior: PROPERTY_BEHAVIOR_MANAGED
        enabled: true
        display_key: "common.license"
        group_key: "licenses"
        sort_order: 100
      },
      {
        scope: PROPERTY_SCOPE_USER
        key: "user.wanted"
        value_type: PROPERTY_VALUE_TYPE_BOOL
        value_format: PROPERTY_VALUE_FORMAT_PLAIN
        behavior: PROPERTY_BEHAVIOR_MANAGED
        enabled: true
        pinned: true
        display_mode: PROPERTY_DISPLAY_MODE_PROFILE_BADGE
        display_key: "common.wanted"
        searchable: true
        group_key: "status"
        sort_order: 100
      },
      {
        scope: PROPERTY_SCOPE_USER
        key: "user.job"
        value_type: PROPERTY_VALUE_TYPE_STRING
        enabled: true
        pinned: true
        display_mode: PROPERTY_DISPLAY_MODE_PROFILE_BADGE
        display_key: "common.job"
        searchable: true
        group_key: "status"
        sort_order: 400
      },
      {
        scope: PROPERTY_SCOPE_USER
        key: "user.traffic_infraction_points"
        value_type: PROPERTY_VALUE_TYPE_INTEGER
        renderer: PROPERTY_RENDERER_TRAFFIC_POINTS
        enabled: true
        pinned: true
        display_key: "common.traffic_infraction_points"
        searchable: true
        group_key: "status"
        sort_order: 200
      },
      {
        scope: PROPERTY_SCOPE_USER
        key: "user.open_fines"
        value_type: PROPERTY_VALUE_TYPE_INTEGER
        value_format: PROPERTY_VALUE_FORMAT_MONEY
        renderer: PROPERTY_RENDERER_MONEY
        enabled: true
        pinned: true
        display_key: "common.fine"
        searchable: true
        group_key: "status"
        sort_order: 300
      },
      {
        scope: PROPERTY_SCOPE_USER
        key: "user.blood_type"
        value_type: PROPERTY_VALUE_TYPE_STRING
        enabled: true
        display_key: "common.blood_type"
        searchable: true
        group_key: "personal"
        sort_order: 400
      },
      {
        scope: PROPERTY_SCOPE_USER
        key: "user.mugshot"
        value_type: PROPERTY_VALUE_TYPE_STRING
        enabled: true
        display_key: "common.mugshot"
        group_key: "personal"
        sort_order: 500
      },
      {
        scope: PROPERTY_SCOPE_USER
        key: "user.files"
        value_type: PROPERTY_VALUE_TYPE_STRING
        behavior: PROPERTY_BEHAVIOR_MANAGED
        enabled: true
        display_key: "common.file"
        group_key: "personal"
        sort_order: 600
      },
      {
        scope: PROPERTY_SCOPE_USER
        key: "user.labels"
        value_type: PROPERTY_VALUE_TYPE_STRING
        behavior: PROPERTY_BEHAVIOR_MANAGED
        enabled: true
        display_key: "common.label"
        group_key: "labels"
        sort_order: 500
      },
      {
        scope: PROPERTY_SCOPE_USER
        key: "user.email"
        value_type: PROPERTY_VALUE_TYPE_STRING
        renderer: PROPERTY_RENDERER_EMAIL
        behavior: PROPERTY_BEHAVIOR_MANAGED
        enabled: true
        display_key: "common.mail"
        searchable: true
        group_key: "contact"
        sort_order: 200
      }
    ]
  };

  rpc ListCitizens(ListCitizensRequest) returns (ListCitizensResponse) {
    option (codegen.perms.perms) = {
      enabled: true
      attrs: [
        {
          key: "Properties"
          type: ATTRIBUTE_TYPE_PROPERTY_LIST
          property_scope: PROPERTY_SCOPE_USER
        }
      ]
    };
  }
  rpc GetUser(GetUserRequest) returns (GetUserResponse) {
    option (codegen.perms.perms) = {
      enabled: true
      attrs: [
        {
          key: "Jobs"
          type: ATTRIBUTE_TYPE_JOB_GRADE_LIST
        }
      ]
    };
  }

  rpc ListUserActivity(ListUserActivityRequest) returns (ListUserActivityResponse) {
    option (codegen.perms.perms) = {
      enabled: true
      attrs: [
        {
          key: "Fields"
          type: ATTRIBUTE_TYPE_STRING_LIST
          valid_string_list: [
            "SourceUser",
            "Own"
          ]
        }
      ]
    };
  }

  rpc SetUserProps(SetUserPropsRequest) returns (SetUserPropsResponse) {
    option (codegen.perms.perms) = {
      enabled: true
      attrs: [
        {
          key: "Properties"
          type: ATTRIBUTE_TYPE_PROPERTY_LIST
          property_scope: PROPERTY_SCOPE_USER
        }
      ]
    };
  }

  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  // buf:lint:ignore RPC_REQUEST_STANDARD_NAME
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  rpc UploadAvatar(stream resources.file.UploadFileRequest) returns (resources.file.UploadFileResponse) {
    option (codegen.perms.perms) = {
      enabled: true
      name: "Any"
    };
  }
  rpc DeleteAvatar(DeleteAvatarRequest) returns (DeleteAvatarResponse) {
    option (codegen.perms.perms) = {
      enabled: true
      name: "Any"
    };
  }

  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  // buf:lint:ignore RPC_REQUEST_STANDARD_NAME
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  rpc UploadMugshot(stream resources.file.UploadFileRequest) returns (resources.file.UploadFileResponse) {
    option (codegen.perms.perms) = {
      enabled: true
      name: "SetUserProps"
    };
  }
  rpc DeleteMugshot(DeleteMugshotRequest) returns (DeleteMugshotResponse) {
    option (codegen.perms.perms) = {
      enabled: true
      name: "SetUserProps"
    };
  }

  rpc ListCitizenFiles(ListCitizenFilesRequest) returns (ListCitizenFilesResponse) {
    option (codegen.perms.perms) = {
      enabled: true
      name: "ListCitizens"
    };
  }
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  // buf:lint:ignore RPC_REQUEST_STANDARD_NAME
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  rpc UploadCitizenFile(stream resources.file.UploadFileRequest) returns (resources.file.UploadFileResponse) {
    option (codegen.perms.perms) = {
      enabled: true
      name: "SetUserProps"
    };
  }
  // Requires DeleteCitizenFile and SetUserProps with the user.files property.
  rpc DeleteCitizenFile(DeleteCitizenFileRequest) returns (DeleteCitizenFileResponse) {
    option (codegen.perms.perms) = {enabled: true};
  }
}
