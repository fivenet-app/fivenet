syntax = "proto3";

package services.notifications;

import "buf/validate/validate.proto";
import "codegen/itemslen/itemslen.proto";
import "codegen/perms/perms.proto";
import "resources/common/database/database.proto";
import "resources/mailer/events/events.proto";
import "resources/notifications/clientview/clientview.proto";
import "resources/notifications/events/events.proto";
import "resources/notifications/notifications.proto";

option go_package = "github.com/fivenet-app/fivenet/v2026/gen/go/proto/services/notifications;notifications";

message GetNotificationsRequest {
  resources.common.database.PaginationRequest pagination = 1 [(buf.validate.field).required = true];
  optional bool include_read = 2;
  repeated resources.notifications.NotificationCategory categories = 3 [(buf.validate.field).repeated = {
    max_items: 8
    items: {
      enum: {defined_only: true}
    }
  }];
  repeated resources.notifications.NotificationKind kinds = 4 [(buf.validate.field).repeated = {
    max_items: 32
    items: {
      enum: {defined_only: true}
    }
  }];
  optional bool include_archived = 5;
  optional bool starred_only = 6;
  optional bool archived_only = 7;
}

message GetNotificationsResponse {
  resources.common.database.PaginationResponse pagination = 1 [(buf.validate.field).required = true];
  repeated resources.notifications.Notification notifications = 2 [(codegen.itemslen.enabled) = true];
}

message MarkNotificationsRequest {
  bool unread = 1;
  repeated int64 ids = 2 [
    (buf.validate.field).repeated = {
      min_items: 1
      max_items: 20
    },
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  optional bool all = 3;
}

message MarkNotificationsResponse {
  int64 updated = 1;
  // The authoritative unread count after the mutation.
  int64 unread_count = 2;
}

message UpdateNotificationStateRequest {
  repeated int64 ids = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 20
  }];
  optional bool unread = 2;
  optional bool starred = 3;
  optional bool archived = 4;
}

message UpdateNotificationStateResponse {
  int64 updated = 1;
  int64 unread_count = 2;
}

message GetNotificationPreferencesRequest {}

message GetNotificationPreferencesResponse {
  repeated resources.notifications.NotificationPreference preferences = 1 [(codegen.itemslen.enabled) = true];
}

// Updates one preference scope. Fields omitted from preference inherit from a
// less-specific scope. reset removes the complete override for this scope.
message UpdateNotificationPreferenceRequest {
  resources.notifications.NotificationPreference preference = 1 [(buf.validate.field).required = true];
  optional bool reset = 2;
}

message UpdateNotificationPreferenceResponse {
  repeated resources.notifications.NotificationPreference preferences = 1 [(codegen.itemslen.enabled) = true];
}

message StreamRequest {
  oneof data {
    option (buf.validate.oneof).required = true;

    resources.notifications.clientview.ClientView clientview = 1;
  }
}

message StreamResponse {
  int64 notification_count = 1;
  optional bool restart = 2;

  oneof data {
    option (buf.validate.oneof).required = true;

    resources.notifications.events.UserEvent user_event = 3;
    resources.notifications.events.JobEvent job_event = 4;
    resources.notifications.events.JobGradeEvent job_grade_event = 5;
    resources.notifications.events.SystemEvent system_event = 6;
    resources.mailer.events.MailerEvent mailer_event = 7;
    resources.notifications.clientview.ObjectEvent object_event = 8;
    // Sent immediately after a stream is established so clients can render
    // notification state without waiting for a later event.
    bool notification_state = 9;
  }
}

service NotificationsService {
  rpc GetNotifications(GetNotificationsRequest) returns (GetNotificationsResponse) {
    option (codegen.perms.perms) = {
      enabled: true
      name: "Any"
    };
  }
  rpc MarkNotifications(MarkNotificationsRequest) returns (MarkNotificationsResponse) {
    option (codegen.perms.perms) = {
      enabled: true
      name: "Any"
    };
  }
  rpc UpdateNotificationState(UpdateNotificationStateRequest) returns (UpdateNotificationStateResponse) {
    option (codegen.perms.perms) = {
      enabled: true
      name: "Any"
    };
  }
  rpc GetNotificationPreferences(GetNotificationPreferencesRequest) returns (GetNotificationPreferencesResponse) {
    option (codegen.perms.perms) = {
      enabled: true
      name: "Any"
    };
  }
  rpc UpdateNotificationPreference(UpdateNotificationPreferenceRequest) returns (UpdateNotificationPreferenceResponse) {
    option (codegen.perms.perms) = {
      enabled: true
      name: "Any"
    };
  }

  rpc Stream(stream StreamRequest) returns (stream StreamResponse) {
    option (codegen.perms.perms) = {
      enabled: true
      name: "Any"
    };
  }
}
