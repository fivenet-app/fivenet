syntax = "proto3";

package services.vehicles;

import "buf/validate/validate.proto";
import "codegen/itemslen/itemslen.proto";
import "codegen/perms/perms.proto";
import "codegen/sanitizer/sanitizer.proto";
import "resources/common/database/database.proto";
import "resources/properties/properties.proto";
import "resources/timestamp/timestamp.proto";
import "resources/vehicles/activity/activity.proto";
import "resources/vehicles/props/props.proto";
import "resources/vehicles/vehicles.proto";

option go_package = "github.com/fivenet-app/fivenet/v2026/gen/go/proto/services/vehicles;vehicles";

message ListVehiclesRequest {
  resources.common.database.PaginationRequest pagination = 1 [(buf.validate.field).required = true];
  optional resources.common.database.Sort sort = 2;
  // Search params
  optional string license_plate = 3 [(buf.validate.field).string.max_len = 32];
  optional string model = 4 [(buf.validate.field).string.max_len = 32];
  repeated int32 user_ids = 5 [(buf.validate.field).repeated = {
    max_items: 10
    items: {
      int32: {gte: 0}
    }
  }];
  optional string job = 6 [(buf.validate.field).string.max_len = 20];
  optional bool wanted = 7;
  repeated resources.properties.PropertyFilter property_filters = 8 [(buf.validate.field).repeated.max_items = 8];
}

message ListVehiclesResponse {
  resources.common.database.PaginationResponse pagination = 1 [(buf.validate.field).required = true];
  repeated resources.vehicles.Vehicle vehicles = 2 [(codegen.itemslen.enabled) = true];
}

message SetVehiclePropsRequest {
  resources.vehicles.props.VehicleProps props = 1 [(buf.validate.field).required = true];
  string reason = 2 [
    (buf.validate.field).string = {
      min_len: 3
      max_len: 255
    },
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (codegen.sanitizer.sanitizer) = {enabled: true}
  ];
  // Generic custom scalar properties. Managed system properties continue to
  // use the dedicated fields above and produce their specialized activities.
  repeated resources.properties.PropertyChange property_changes = 3 [(buf.validate.field).repeated.max_items = 20];
}

message SetVehiclePropsResponse {
  resources.vehicles.props.VehicleProps props = 1;
}

message ListVehicleActivityRequest {
  resources.common.database.PaginationRequest pagination = 1 [(buf.validate.field).required = true];
  optional resources.common.database.Sort sort = 2;
  // Search params
  string plate = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
  }];
  // Activity types to filter by. If empty, all activity types will be returned.
  repeated resources.vehicles.activity.VehicleActivityType types = 4 [(buf.validate.field).repeated = {
    max_items: 10
    items: {
      enum: {defined_only: true}
    }
  }];
  optional resources.timestamp.Timestamp from = 5;
  optional resources.timestamp.Timestamp to = 6;
  // Restricts generic PROPERTY activity entries to these custom property keys.
  repeated string property_keys = 7 [(buf.validate.field).repeated = {
    max_items: 20
    items: {
      string: {max_len: 64}
    }
  }];
}

message ListVehicleActivityResponse {
  resources.common.database.PaginationResponse pagination = 1 [(buf.validate.field).required = true];
  repeated resources.vehicles.activity.VehicleActivity activity = 2 [(codegen.itemslen.enabled) = true];
}

service VehiclesService {
  option (codegen.perms.perms_svc) = {
    order: 40
    icon: "i-mdi-car-outline"
    property_groups: {
      scope: PROPERTY_SCOPE_VEHICLE
      key: "status"
      display_key: "components.settings.property_definitions.groups.status"
      sort_order: 100
    }
    system_properties: [
      {
        scope: PROPERTY_SCOPE_VEHICLE
        key: "vehicle.wanted"
        value_type: PROPERTY_VALUE_TYPE_BOOL
        value_format: PROPERTY_VALUE_FORMAT_PLAIN
        behavior: PROPERTY_BEHAVIOR_MANAGED
        enabled: true
        pinned: true
        display_mode: PROPERTY_DISPLAY_MODE_PROFILE_BADGE
        display_key: "common.wanted"
        searchable: true
        group_key: "status"
        sort_order: 100
      }
    ]
  };

  rpc ListVehicles(ListVehiclesRequest) returns (ListVehiclesResponse) {
    option (codegen.perms.perms) = {
      enabled: true
      attrs: [
        {
          key: "Properties"
          type: ATTRIBUTE_TYPE_PROPERTY_LIST
          property_scope: PROPERTY_SCOPE_VEHICLE
        }
      ]
    };
  }

  rpc SetVehicleProps(SetVehiclePropsRequest) returns (SetVehiclePropsResponse) {
    option (codegen.perms.perms) = {
      enabled: true
      attrs: [
        {
          key: "Properties"
          type: ATTRIBUTE_TYPE_PROPERTY_LIST
          property_scope: PROPERTY_SCOPE_VEHICLE
        }
      ]
    };
  }

  rpc ListVehicleActivity(ListVehicleActivityRequest) returns (ListVehicleActivityResponse) {
    option (codegen.perms.perms) = {
      enabled: true
      attrs: [
        {
          key: "Fields"
          type: ATTRIBUTE_TYPE_STRING_LIST
          valid_string_list: [
            "Creator",
            "Own"
          ]
        }
      ]
    };
  }
}
