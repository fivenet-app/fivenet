<link rel="stylesheet" href="/css/herofull-pattern.css" />

<style>
    .loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        user-select: none;
        background-color: var(--ui-bg, #171717);
    }
    .loader-overlay {
        position: relative;
        isolation: isolate;
        display: flex;
        min-height: 100vh;
        min-height: 100dvh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 50px;
        text-align: center;
    }
    .loader-overlay-img,
    .loader-spinner {
        margin: 0;
    }
    .loader-overlay img,
    .loader-spinner svg {
        width: 92px;
        height: 92px;
    }
    .loader-spinner svg {
        fill: #fff;
        animation: spin 900ms linear infinite;
    }

    .hero-overlay > * {
        position: relative;
        z-index: 1;
    }

    .loader-reset {
        position: fixed;
        left: 50%;
        bottom: 20px;
        z-index: 99999;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 24px;
        padding: 4px 16px;
        border-radius: 8px;
        border: 1px solid rgba(37, 99, 235, 0.25);
        background: rgb(0, 188, 255);
        color: #ffffff;
        font-size: 12px;
        font-weight: 500;
        text-decoration: none;
        transform: translate(-50%, 12px);
        opacity: 0;
        pointer-events: none;
        transition:
            opacity 220ms ease,
            transform 220ms ease;
    }

    .loader-reset.is-visible {
        opacity: 1;
        pointer-events: auto;
        transform: translateX(-50%);
    }

    .loader-reset:hover {
        opacity: 0.8;
    }

    .loader-reset:focus-visible {
        outline: 2px solid rgba(255, 255, 255, 0.85);
        outline-offset: 2px;
        opacity: 1;
    }

    @media (prefers-reduced-motion: reduce) {
        .loader-spinner svg {
            animation: none;
        }

        .loader-reset {
            transition: none;
        }
    }

    @keyframes spin {
        from {
            transform: rotate(0deg);
        }
        to {
            transform: rotate(360deg);
        }
    }
</style>

<div class="loader hero">
    <div class="loader-overlay hero-overlay">
        <div class="loader-overlay-img">
            <img src="/images/logo-200x200.webp" width="92" height="92" alt="FiveNet Logo" decoding="async" />
        </div>

        <div class="loader-spinner">
            <!-- Material Design Icons (MDI) - Loading Icon -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M12,4V2A10,10 0 0,0 2,12H4A8,8 0 0,1 12,4Z" />
            </svg>
        </div>
    </div>
</div>

<div class="loader-reset-region" role="status" aria-live="polite" aria-atomic="true">
    <a class="loader-reset" href="/api/clear-site-data" aria-hidden="true" tabindex="-1" aria-label="Reset the FiveNet app">
        Trouble loading? Try to reset your FiveNet app.
    </a>
</div>

<script>
    const messages = {
        en: 'Trouble loading? Try to reset your FiveNet app.',
        de: 'Lädt es nicht? Hier klicken, um deine FiveNet-App zurückzusetzen.',
    };

    function pickLocale() {
        const browser = (navigator.languages && navigator.languages[0]) || navigator.language || 'en';
        const short = browser.toLowerCase().split('-')[0];

        return messages[short] ? short : 'en';
    }

    window.setTimeout(() => {
        const resetButton = document.querySelector('.loader-reset');
        if (resetButton) {
            console.debug('Showing reset app button after 6.5 seconds of loading delay...');
            const locale = pickLocale();
            resetButton.textContent = messages[locale];
            resetButton.setAttribute('aria-label', messages[locale]);
            resetButton.removeAttribute('aria-hidden');
            resetButton.removeAttribute('tabindex');
            resetButton.classList.add('is-visible');
        }
    }, 6500);
</script>
