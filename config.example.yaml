#
# Be sure to checkout the Config file reference: <https://fivenet.app/getting-started/configuration/config-reference>
#

# Mode `debug` or `release` mode. `debug` mode affects performance and logging; `release` mode is the default and should be used in production.
mode: "release"

# LogLevel controls the minimum severity emitted by the application logger.
logLevel: "INFO"
log:
  # If enabled logs are sent to stderr instead of stdout.
  logToStderr: true
  # LogToFile enables logging to a file instead of stdout.
  logToFile: false
  # Contains the configuration for file logging (if LogToFile is true, make sure to configure this).
  file:
    # Path to the log file.
    path: "fivenet.log"
    # Rotation contains the configuration for log rotation.
    rotation:
      # MaxSize is the maximum size in megabytes of the log file before it gets rotated.
      maxSize: 100 # MB
      # MaxBackups is the maximum number of old log files to retain.
      maxBackups: 7
      # MaxAge is the maximum number of days to retain old log files based on the timestamp.
      maxAge: 14
      # Compression determines the compression algorithm to use for rotated log files. It can be "none", "gzip", or "zstd".
      compression: "zstd"
      # Rotation interval for log rotation (e.g., daily rotation).
      rotationInterval: 24h

  # LevelOverrides overrides LogLevel for individual components. Empty values use LogLevel.
  levelOverrides:
    kvstore: "INFO"
    locks: "INFO"
    cron: "INFO"
    perms: "INFO"

# Secret is the app-wide secret used to encrypt and decrypt stored data. It must contain exactly 32 random bytes and differ from JWT.Secret.
secret: "your_generated_db_secret_32_char"

# Skips startup checks for database and NATS connectivity. Use only when those services are intentionally unavailable at boot.
ignoreRequirements: false

jwt:
  # Secret is the JWT signing secret. It must contain at least 32 random bytes and differ from the app-wide Secret.
  secret: "your_generated_jwt_secret_32char"

http:
  # Listen is the address for the public HTTP server.
  listen: ":8080"
  # AdminListen is the address for metrics and Go debug endpoints. Leave it empty to disable the admin server.
  adminListen: ":7070"
  # PublicURL is the canonical public base URL, including scheme and host.
  publicURL: "https://fivenet.example.com"
  origins:
    # Origins lists browser origins allowed to access the frontend and API.
    - "https://fivenet.example.com"
    #- "http://localhost:3000" # Only for development
  # TrustedProxies lists reverse-proxy IPs or CIDRs trusted to forward client IP and protocol headers.
  trustedProxies: []
    #- "10.0.0.0/8" # Common Kubernetes cluster IP range
    #- "127.0.0.1" # For development
  sessions:
    # CookieSecret signs and encrypts session cookies. It must contain at least 32 random bytes and be unique to this deployment.
    cookieSecret: "your_generated_cookie_secret_32c"
    # Domain is the cookie domain.
    domain: "fivenet.example.com"

appConfig:
  # Initial is applied and persisted only when the application configuration is first created.
  initial:
    # Website configures website settings.
    website:
      # Links configures optional legal links.
      links:
        privacyPolicy: ""
        imprint: ""
  # Override is applied in memory at every startup when enabled. It does not modify the database-backed configuration.
  override:
    # Enabled controls whether the override is applied.
    enabled: false
    # Website configures website settings.
    website:
      # Links configures optional legal links.
      links: {}
        #privacyPolicy: ""
        #imprint: ""

database:
  # Use either a DSN string or the individual host/port/username/password fields below.
  # DSN reference: https://github.com/go-sql-driver/mysql#dsn-data-source-name
  # `parseTime` is always enabled by the application.
  dsn: "DB_USER:DB_PASS@tcp(DB_HOST:DB_PORT)/DB_NAME?collation=utf8mb4_unicode_ci&loc=Europe%2FBerlin"
  # Example for a locally hosted database
  #dsn: "fivenet:changeme@tcp(localhost:3306)/fivenet?collation=utf8mb4_unicode_ci&loc=Europe%2FBerlin"
  #
  # Or use individual parameters instead. Comment out `dsn:` if you set these.
  # Hint: you can set these via environment variables as well, e.g., FIVENET_DATABASE_HOST, FIVENET_DATABASE_PORT,
  # FIVENET_DATABASE_USERNAME, FIVENET_DATABASE_PASSWORD, FIVENET_DATABASE_DATABASE
  #host: "localhost"
  #port: 3306
  #username: "fivenet"
  #password: "changeme"
  #database: "fivenet"

  # MaxOpenConns defines the maximum number of open connections to the database.
  maxOpenConns: 32
  # MaxIdleConns defines the maximum number of idle connections to the database.
  maxIdleConns: 5
  # ConnMaxIdleTime specifies the maximum time a connection may remain idle.
  connMaxIdleTime: 15m
  # ConnMaxLifetime specifies the maximum time a connection may remain open.
  connMaxLifetime: 60m
  # DisableLocking disables table locking, mainly for migrations.
  disableLocking: false
  # Skip database migrations on startup. Only enable this if migrations are managed externally.
  skipMigrations: false
  custom:
    # Columns maps FiveNet fields to custom database column names. Set a column to "-" to disable it.
    columns:
      user:
        visum: "visum"
        playtime: "playtime"
      vehicle:
        model: "model"
    # Conditions configures custom database query conditions.
    conditions:
      user:
        filterEmptyName: false

nats:
  # URL is the NATS server URL.
  url: "nats://fivenet:fivenet_topsecret@nats:4222"
  # Replicas is the number of JetStream replicas.
  replicas: 1
  # NKey is an optional NATS NKey seed used for authentication.
  #nKey: null
  # Creds is an optional path to a NATS credentials file.
  #creds: null
  # PublishAsyncMaxPending is the NATS JetStream asynchronous-publish pending limit. NATS defaults to 4000.
  publishAsyncMaxPending: 2000

storage:
  # Type selects the storage backend: "filesystem", "s3", or "noop". Only the matching backend configuration is used.
  type: "filesystem"
  # Filesystem configures local filesystem storage.
  filesystem:
    # Path is the local filesystem root.
    path: "/data"
    # Prefix is an optional relative key prefix.
    prefix: ""
  s3:
    # S3 configures S3-compatible object storage.
    # Endpoint is the S3-compatible API endpoint.
    endpoint: ""
    # Region is the S3 region.
    region: "us-east-1"
    # AccessKeyID is the S3 access key ID.
    accessKeyID: ""
    # SecretAccessKey is the S3 secret access key.
    secretAccessKey: ""
    # UseSSL controls whether the S3 endpoint is contacted over TLS.
    useSSL: true
    # BucketName is the target S3 bucket.
    bucketName: ""
    # Prefix is an optional relative key prefix.
    prefix: ""
    # Retries is the number of storage operation retries.
    retries: 3
    # CheckOnStartup verifies S3 access during startup.
    checkOnStartup: false
  # MetricsEnabled enables periodic collection of storage metrics.
  metricsEnabled: true
  # MetricsInterval is the period between storage metric collections.
  metricsInterval: 10m

imageProxy:
  # AllowHosts is a list of hostnames or wildcard patterns that are allowed to be proxied. If empty, all hostnames are allowed.
  # Deny rules take precedence over allow rules.
  allowHosts: []
  # DenyHosts is a list of hostnames or wildcard patterns that are denied from being proxied. If empty, no hostnames are denied.
  denyHosts: []
  # Whether literal public IP addresses may be used as image hosts.
  allowIPs: false
  # MinimumCacheDuration is the minimum duration for which proxied images should be cached. If not set, defaults to 60 minutes.
  minimumCacheDuration: 30m

audit:
  # RetentionDays specifies the number of days to retain audit logs before they are purged. Must be greater than or equal to 1.
  retentionDays: 180

oauth2:
  # List of OAuth2 Providers
  providers:
    # Example for Discord OAuth2 provider configuration
    - name: "discord"
      # Internal provider type used in config and callback routes.
      type: "discord"
      # Display label shown to users on the login button.
      label: "Discord"
      # Provider homepage shown for reference in the UI.
      homepage: "https://discord.com"
      # Iconify icon name or image URL shown on the login button.
      icon: "i-simple-icons-discord"
      # Optional fallback avatar URL for users without a provider avatar.
      #defaultAvatar: ""
      # Redirect/callback URL registered with Discord. This must point back to this FiveNet instance.
      redirectURL: "https://localhost:3000/api/oauth2/callback/discord"
      # OAuth2 client ID issued by Discord for this application.
      clientID: "your_discord_oauth2_client_id"
      # OAuth2 client secret issued by Discord for this application.
      clientSecret: "your_discord_oauth2_client_secret"
      # Scopes requested from Discord. Keep these aligned with the data you need.
      scopes:
        - guilds
        - identify
      # The endpoints section is optional for the Discord provider since the
      # implementation uses the default Discord OAuth2 endpoints.
      # It can be used to override the default endpoints if needed.
      #endpoints:
      #  authURL: "https://discord.com/api/oauth2/authorize"
      #  tokenURL: "https://discord.com/api/oauth2/token"
      #  userInfoURL: "https://discord.com/api/users/@me"
    # Example for generic OAuth2 provider configuration
    - name: "my_generic_provider"
      # Internal provider name used in config and callback routes.
      type: "generic"
      # Display label shown to users on the login button.
      label: "Generic OAuth2 Provider"
      # Provider homepage shown for reference in the UI.
      homepage: "https://example.com"
      # Iconify icon name or image URL shown on the login button.
      icon: "i-simple-icons-openid"
      # Optional fallback avatar URL for users without a provider avatar.
      defaultAvatar: "https://example.com/images/avatar-default.svg"
      # Redirect/callback URL registered with the OAuth2 provider. This must point back to this FiveNet instance.
      # Example: https://YOUR_FIVENET_DOMAIN_NAME/api/oauth2/callback/OAUTH_PROVIDER_NAME
      redirectURL: "http://example.com/api/oauth2/callback/my_generic_provider"
      # OAuth2 client ID issued by the provider for this application.
      clientID: "your_generic_oauth2_client_id"
      # OAuth2 client secret issued by the provider for this application.
      clientSecret: "your_generic_oauth2_client_secret"
      # Scopes requested from the provider. Keep these aligned with the data you need.
      scopes:
        - openid
        - nickname
        - profile
      endpoints:
        # Authorization endpoint used to start the OAuth2 flow.
        authURL: "https://example.com/oauth2/authorize"
        # Token endpoint used to exchange the auth code for a token.
        tokenURL: "https://example.com/oauth2/token"
        # User information endpoint used to fetch profile data after login.
        userInfoURL: "https://example.com/oauth2/user-info"
      # Mapping fields tell FiveNet which claims/fields to read from the provider response.
      mapping:
        # Unique user identifier claim.
        id: "sub"
        # Username/display-name claim.
        username: "nickname"
        # Avatar URL claim.
        avatar: "picture"

# PostalsFile is the path to the postals data file.
postalsFile: ".output/public/data/postals.json"

auth:
  # SuperuserGroups is used as a legacy fallback if ConfigAdminGroups is empty.
  #superuserGroups: []
  # SuperuserUsers is used as a legacy fallback if ConfigAdminUsers is empty.
  #superuserUsers: []

  # JobAdminGroups defines groups with basic administrative privileges for managing jobs.
  jobAdminGroups: []
  # JobAdminUsers defines users with basic administrative privileges for managing jobs.
  jobAdminUsers: []

  # ConfigAdminGroups defines groups with full administrative privileges for managing jobs and configuration.
  configAdminGroups:
    - projektleiter
    - teamleitung
  # ConfigAdminUsers defines users with full administrative privileges for managing jobs and configuration.
  configAdminUsers: []
  # PermsCacheSize is the maximum number of permission entries cached in memory. Set it to 0 to disable caching.
  #permsCacheSize: 1024
  # PermsCacheTTL is the time-to-live for cached permission entries. It must be at least one second.
  #permsCacheTTL: 30s

dispatchCenter:
  # Enabled enables dispatch-center integration for phone plugin dispatch systems.
  enabled: false
  # Type is the dispatch-center implementation to use.
  type: "gksphone"
  # ConvertJobs lists jobs whose dispatches should be converted.
  convertJobs: []
    #- police

discord:
  # Enabled enables the Discord integration.
  enabled: true
  # DryRun prevents role changes and messages, for testing.
  dryRun: false
  # Token is the Discord bot token.
  token: "your_discord_bot_token"
  # Sync controls whether any Discord synchronization is performed.
  sync: true

  # GroupSync configures synchronization of server groups to Discord roles.
  groupSync:
    # Enabled enables group-to-role synchronization.
    enabled: true
    # Mapping maps server group names to Discord role settings.
    mapping:
      fraktionsverwaltung:
        # RoleName is the Discord role name.
        roleName: "Fraktionsverwaltung"
        # Permissions optionally sets the Discord permission bitset for the role.
        #permissions: 0
        # Color is the Discord role color as a hexadecimal value.
        #color: "#9B59B6"
        # NotSameJob only assigns this role when the user's job differs from the group's job.
        notSameJob: true
      teamleitung:
        # RoleName is the Discord role name.
        roleName: "Teamleitung"
        # Permissions optionally sets the Discord permission bitset for the role.
        #permissions: 0
        # Color is the Discord role color as a hexadecimal value.
        #color: "#9B59B6"
  # UserInfoSync configures synchronization of job, grade, and qualification information to Discord roles.
  userInfoSync:
    # Enabled enables user-information role synchronization.
    enabled: true
    # GradeRoleFormat formats job-grade role names. It supports %grade% and %grade_label%.
    gradeRoleFormat: "[%grade%] %grade_label%"
    # EmployeeRoleFormat formats employee-count role names. It receives the employee count via %s.
    employeeRoleFormat: "%s Employees"
    # UnemployedRoleName is the role assigned to unemployed users.
    unemployedRoleName: "Citizen"
    # JobsAbsceneRoleName is the role assigned to users absent from their job.
    jobsAbsceneRoleName: "Absent"
  # Qualifications configures synchronization of qualifications to Discord roles.
  qualifications:
    # Enabled enables qualification-to-role synchronization.
    enabled: true
  # Commands configures Discord command registration and availability.
  commands:
    # Enabled enables Discord command registration.
    enabled: true

    # Absent enables the absent command.
    absent: true
    # Fivenet enables the fivenet command.
    fivenet: true
    # Help enables the help command.
    help: true
    # Sync enables the sync command.
    sync: true

  # CalendarReminders enables calendar reminders in Discord.
  calendarReminders: true

# Game configures game-server conventions.
game:
  # First grade number/id. Some servers start at 0, others at 1.
  startJobGrade: 0
  # Automatically delete roles for jobs that no longer exist.
  cleanupRolesForMissingJobs: false

# Sync configures the external synchronization API.
sync:
  # Enable or disable the sync API endpoint. Required for the FiveNet plugin and DBSync function.
  enabled: false
  # API tokens accepted for sync requests. Keep each token separate and secret.
  apiTokens: []
    #- LONG_RANDOM_API_TOKEN_FOR_DBSYNC

# UpdateCheck configures periodic update checks.
updateCheck:
  # If enabled, it will check for updates every interval.
  enabled: true
  # Interval for checking updates, e.g., "1h", "30m", "15s"
  interval: "6h"

# Config options for the Iconify API (served from the backend)
icons:
  # If true, the backend server proxies Iconify requests instead of serving local icon sets.
  proxy: false
  # If you are using the proxy mode, make sure to support the Iconify project: https://iconify.design/sponsors/
  apiUrl: "https://api.iconify.design"
  # Directory containing local icon sets when proxy mode is disabled.
  # The `./icons` path works with the official FiveNet container images.
  path: ./icons

# OTLP configures OpenTelemetry tracing.
otlp:
  # Enable OTLP tracing.
  enabled: false
  # Export mode: stdout for local debugging, grpc/http for an OTLP collector.
  type: "stdout"
  # OTLP collector endpoint URL. Usually a full `http://` or `https://` URL.
  url: "http://localhost:4317"
  insecure: false
  timeout: 10s
  environment: "dev"
  ratio: 0.1
  # Additional span/resource attributes.
  attributes: []
  # - service.name=fivenet-server
  # - k8s.namespace.name=${POD_NAMESPACE}
  headers: {}
    # Example to authenticate with an API key
    #authorization: "OTEL_API_KEY_HERE"
  # Compression for OTLP exporters (`none` or `gzip`).
  compression: "none"
  frontend:
    # Frontend trace endpoint; leave empty to disable frontend instrumentation.
    url: ""
    headers: {}
      # Example to authenticate with an API key
      #authorization: "OTEL_API_KEY_HERE"
