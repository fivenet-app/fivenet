name: OSV-Scanner Scan

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
  schedule:
    # Run at 12:30 every week on Monday
    - cron: '30 12 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan:
    name: Scan dependencies
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.6.0
