name: OSV-Scanner Scan

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
  schedule:
    # Run at 12:30 every week on Monday
    - cron: '30 12 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  osv-scan:
    name: Scan dependencies
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
